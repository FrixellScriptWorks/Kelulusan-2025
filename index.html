<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengumuman Kelulusan</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Halaman dibatasi sampai waktu dibuka -->
  <div id="akses-tertutup" style="text-align:center; padding: 40px;">
    <h2>Akses belum dibuka</h2>
    <p>Website ini akan dibuka pada <strong>2 Juni 2025 pukul 10.00 WIB</strong></p>

    <!-- Bungkus countdown dengan wrapper di luar -->
    <div class="countdown-wrapper">
      <div id="countdown"></div>
    </div>
  </div>

  <!-- Konten utama tersembunyi dulu -->
  <div id="main-content" style="display:none;">
    <div class="container">
      <div class="header">
        <img src="img/LogoJisc.png" alt="Logo Sekolah" class="logo" style="margin: auto;">
      </div>

      <h1>Pengumuman Kelulusan <br> Tahun Angkatan 2024-2025</h1>

      <form id="form-nisn">
        <input type="text" id="nisn-input" placeholder="Masukkan NISN Anda" required>
        <button type="submit">Cek Kelulusan</button>
      </form>

      <div id="result" class="result-card" style="display: none;">
        <div class="certificate">
          <div class="cert-left">
            <img id="foto-siswa" src="" alt="Foto Siswa">
          </div>
          <div class="cert-right">
            <h2 id="nama-siswa"></h2>
            <p class="ucapan-selamat">Selamat! Kamu dinyatakan:</p>
            <h3 id="status-kelulusan"></h3>
          </div>
        </div>

        <div class="pdf-section">
          <h3>Surat Kelulusan:</h3>
          <iframe id="pdf-viewer" src="" width="100%" height="500px"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
